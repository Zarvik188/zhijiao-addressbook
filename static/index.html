<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>知交 · 通讯录</title><link rel="stylesheet" href="/style.css"></head>
<body><aside><a class="brand" href="/">知交<span>CONTACT BOOK</span></a><p class="aside-label">我的通讯录</p><button id="all" class="nav active">☷　全部联系人 <b id="all-count">0</b></button><button id="favorites" class="nav">☆　我的收藏 <b id="favorite-count">0</b></button><div class="aside-note">每一种联系，<br>都值得好好保存。<small>本地单用户课程演示<br>请使用虚构联系人</small></div></aside>
<main><header><div class="breadcrumb">我的工作台 <span>/</span> 通讯录</div><span class="local">● 本机存储</span></header><section class="workspace"><div class="heading"><div><p class="eyebrow">PEOPLE & CONNECTIONS</p><h1 id="heading">全部联系人</h1><p class="subtitle">把重要的人，放在触手可及的地方。</p></div><button id="add" class="primary">＋ 新建联系人</button></div><div class="tools"><label class="search">⌕ <input id="search" placeholder="搜索姓名、分组或联系方式" aria-label="搜索联系人"></label><div class="actions"><a href="/api/template" download="通讯录模板.xlsx">下载模板</a><label class="button">↥ 导入 Excel<input id="import" type="file" accept=".xlsx" hidden></label><a class="button" href="/api/export" download="知交通讯录.xlsx">↧ 导出全部</a></div></div><div class="result-line"><span id="result-count">共 0 位联系人</span><span>姓名 A—Z</span></div><div id="cards" class="cards"></div><div id="empty" class="empty" hidden><div>◎</div><h2>在这里，保存你的第一份联系</h2><p>新建联系人，或使用 Excel 模板批量导入。</p><button id="empty-add" class="primary">＋ 新建联系人</button></div><footer>知交 · 让联系更简单<span>Excel 导入会追加记录，不覆盖同名联系人</span></footer></section></main>
<dialog id="editor"><form id="contact-form"><div class="dialog-title"><div><p class="eyebrow">CONTACT DETAILS</p><h2 id="form-title">新建联系人</h2></div><button type="button" id="close" class="icon" aria-label="关闭">×</button></div><div class="form-grid"><label>姓名 <em>*</em><input name="name" maxlength="80" required placeholder="输入联系人姓名"></label><label>分组<input name="group" maxlength="80" placeholder="例如：同学、朋友"></label></div><div class="method-heading"><h3>联系方式 <em>*</em></h3><button type="button" id="add-method" class="text-button">＋ 添加一项</button></div><p class="hint">同一联系人可保存多个电话、邮箱和社交账号。</p><div id="methods"></div><label class="note-label">备注<textarea name="note" maxlength="2000" rows="3" placeholder="记下一点与 TA 有关的事"></textarea></label><label class="check"><input name="favorite" type="checkbox"> 加入我的收藏</label><p id="form-error" class="error" role="alert"></p><div class="dialog-actions"><button type="button" id="cancel">取消</button><button type="submit" class="primary">保存联系人</button></div></form></dialog>
<div id="toast" role="status" hidden></div><script src="/app.js" defer></script></body></html>
