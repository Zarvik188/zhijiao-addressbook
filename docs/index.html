<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知交通讯录 · 详细功能演示</title><style>body{margin:0;background:#f1f5f2;color:#243d33;font:16px/1.7 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1080px;margin:36px auto;padding:0 24px}h1{font-size:32px;margin-bottom:6px}p{color:#53675d}video{display:block;width:100%;background:#12251c;border-radius:14px;box-shadow:0 8px 32px #18352220}nav{display:flex;gap:20px;flex-wrap:wrap;margin:20px 0}a{color:#17654b}small{display:block;margin:22px 0;color:#64776d}ol{padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:8px}button{text-align:left;width:100%;border:1px solid #d5e1d9;border-radius:8px;background:white;color:#2c5641;padding:10px;font:14px/1.5 system-ui;cursor:pointer}@media(max-width:700px){ol{grid-template-columns:1fr}}</style></head><body><main><h1>知交 · 通讯录</h1><p>EE308FZ 极限编程结对作业 · Luo Yuhan &amp; 徐一超 Xu Yichao</p><video id="demo" controls preload="metadata" playsinline poster="assets/01-contact.jpg"><source src="通讯录核心功能演示.mp4?v=1.1.0" type="video/mp4">浏览器暂不支持视频播放，请使用下方下载链接。</video><nav><a href="https://github.com/Zarvik188/zhijiao-addressbook">查看项目源码</a><a href="通讯录核心功能演示.mp4?v=1.1.0" download>下载详细 MP4</a><a href="https://github.com/Zarvik188/zhijiao-addressbook/blob/main/codestyle.md">代码规范</a><a href="excel-check.html">导出 Excel 只读检查页</a></nav><p>约 1 分 56 秒，含 27 个章节字幕。演示新建与编辑、多电话和邮箱、收藏切换、姓名/电话/分组搜索、刷新持久化、真实 Excel 文件检查、错误文件拒绝和正常导入（6 → 12 条）。</p><h2>点击章节定位播放</h2><ol><li><button onclick="const v=document.getElementById('demo');v.currentTime=0;v.play()">00:00　01 首页：5 位匿名演示联系人、2 位收藏</button></li><li><button onclick="const v=document.getElementById('demo');v.currentTime=4;v.play()">00:04　02 新建联系人：徐某某</button></li><li><button onclick="const v=document.getElementById('demo');v.currentTime=7;v.play()">00:07　03 姓名、分组与主要电话</button></li><li><button onclick="const v=document.getElementById('demo');v.currentTime=11;v.play()">00:11　04 同一联系人增加备用电话</button></li><li><button onclick="const v=document.getElementById('demo');v.currentTime=15;v.play()">00:15　05 增加邮箱并检查输入校验</button></li><li><button onclick="const v=document.getElementById('demo');v.currentTime=19;v.play()">00:19　06 修正邮箱并保存，联系人数量 5 → 6</button></li><li><button onclick="const v=document.getElementById('demo');v.currentTime=22;v.play()">00:22　07 保存后核验六位联系人</button></li><li><button onclick="const v=document.getElementById('demo');v.currentTime=26;v.play()">00:26　08 姓名搜索：只显示徐某某</button></li><li><button onclick="const v=document.getElementById('demo');v.currentTime=30;v.play()">00:30　09 查看并编辑：核验两个电话与邮箱</button></li><li><button onclick="const v=document.getElementById('demo');v.currentTime=34;v.play()">00:34　10 编辑备注并保存</button></li><li><button onclick="const v=document.getElementById('demo');v.currentTime=38;v.play()">00:38　11 收藏筛选：只显示三位已收藏联系人</button></li><li><button onclick="const v=document.getElementById('demo');v.currentTime=42;v.play()">00:42　12 取消收藏后列表立即减少</button></li><li><button onclick="const v=document.getElementById('demo');v.currentTime=46;v.play()">00:46　13 重新收藏并搜索联系方式</button></li><li><button onclick="const v=document.getElementById('demo');v.currentTime=50;v.play()">00:50　14 刷新后数据与收藏仍保留</button></li><li><button onclick="const v=document.getElementById('demo');v.currentTime=54;v.play()">00:54　15 导出全部：下载真实 .xlsx 文件</button></li><li><button onclick="const v=document.getElementById('demo');v.currentTime=58;v.play()">00:58　16 Excel 文件检查：每人一行、同类电话分列</button></li><li><button onclick="const v=document.getElementById('demo');v.currentTime=66;v.play()">01:06　17 核验文本单元格：两个电话的前导零完整保留</button></li><li><button onclick="const v=document.getElementById('demo');v.currentTime=73;v.play()">01:13　18 返回通讯录：导入前仍为六位联系人</button></li><li><button onclick="const v=document.getElementById('demo');v.currentTime=77;v.play()">01:17　19 错误表头：拒绝导入，记录数保持六位</button></li><li><button onclick="const v=document.getElementById('demo');v.currentTime=81;v.play()">01:21　20 正常导入：追加六位联系人，6 → 12</button></li><li><button onclick="const v=document.getElementById('demo');v.currentTime=84;v.play()">01:24　21 再次搜索徐某某：同名追加且各字段完整</button></li><li><button onclick="const v=document.getElementById('demo');v.currentTime=89;v.play()">01:29　22 打开导入后的联系人，核验电话、邮箱及备注</button></li><li><button onclick="const v=document.getElementById('demo');v.currentTime=95;v.play()">01:35　23 结束：关闭编辑，返回十二条记录</button></li><li><button onclick="const v=document.getElementById('demo');v.currentTime=100;v.play()">01:40　24 未找到结果时显示空态提示</button></li><li><button onclick="const v=document.getElementById('demo');v.currentTime=104;v.play()">01:44　25 按分组搜索：课程同学</button></li><li><button onclick="const v=document.getElementById('demo');v.currentTime=108;v.play()">01:48　26 错误文件再次被拒绝，十二条记录保持不变</button></li><li><button onclick="const v=document.getElementById('demo');v.currentTime=111;v.play()">01:51　27 功能演示结束：匿名数据、全部十二条记录</button></li></ol><small>全部联系人均为匿名虚构数据。Excel 检查页直接读取本次导出的原始工作簿制作，明确标注为只读数据检查。此页面用于播放录屏，通讯录应用按仓库说明在本地运行；项目使用 AI 辅助开发。</small></main></body></html>
